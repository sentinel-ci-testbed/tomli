name: sentinel-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Lint
        run: ruff check --isolated --no-cache --select F,E9 src/tomli

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
      - name: Install package
        run: pip install -e .
      - name: Run tests
        timeout-minutes: 5
        run: python -m pytest -q tests
